# Production compose for Neon Postgres.
# Usage (on the server):
#   1. Create the database in Neon (new database in your existing project, or a new project)
#   2. Copy the connection string from the Neon dashboard
#   3. Put the secrets in a `.env` file next to this file (0600 perms) —
#      Compose reads it automatically for the ${...} variables below.
#      NEVER `export` a secret on the command line: it lands in shell
#      history on a shared server (D-m10). Generate values with the
#      commands in runbook §2B and append them with `read -s`, e.g.
#        read -s -p "JWT_SECRET_KEY: " V; printf 'JWT_SECRET_KEY=%s\n' "$V" >> .env
#        chmod 600 .env
#      (`read -s` does not echo and the value never appears on a command
#      line, so history stays clean. If a secret ever does land on a
#      command line, run `history -d <n>` immediately, or set
#      HISTCONTROL=ignorespace and prefix the command with a space.)
#   4. Deploy with ./scripts/deploy.sh (PM-7) — do NOT `up -d --build`
#      directly: it recreates the app while the migration is still
#      running, so old code serves against a new schema. The script
#      stops the app, runs the one-shot migrate service, then starts
#      the new code:
#        docker compose -f docker-compose.prod.yml stop app
#        docker compose -f docker-compose.prod.yml run --rm migrate
#        docker compose -f docker-compose.prod.yml up -d app
#      Expected downtime: a few minutes (image rebuild dominates,
#      typically 1-3 min, plus ~30-60 s boot/seeding) — announce the
#      window; do not deploy on month-end mornings.
#
# TLS is the DEFAULT path, not opt-in (SM-2): the Caddy service below has
# no `--profile tls` gate, and it requires DOMAIN — `up` fails loudly with
# "DOMAIN must be set ..." when it is unset, instead of starting an
# HTTP-only deploy whose login then silently breaks (production cookies
# are Secure + __Host-, which browsers refuse over plain HTTP). There is
# no supported HTTP-only production deploy: if the app is only ever
# reached on 127.0.0.1 (e.g. over an SSH tunnel), set DOMAIN to the
# machine's hostname anyway so Caddy can terminate TLS for it — do NOT
# expose the app directly without TLS (see runbook §2C).
#
# Migrations do NOT run inside the web container. The one-shot `migrate`
# service runs `alembic upgrade head` first (it uses MIGRATION_DATABASE_URL
# when set, else DATABASE_URL — see alembic/env.py) and the web service
# only starts once it exits successfully (depends_on:
# service_completed_successfully). Verify the head before every deploy:
# `alembic heads` / `git log -1 --oneline`. Rollback: revert code +
# rebuild + `alembic downgrade <previous revision>` — see the go-live
# runbook; downgrades past e4f8a2b6d0c5 cannot restore scrubbed audit data,
# so a forward-fix is preferred.
#
# TLS: this file is HTTPS by default — Caddy terminates TLS automatically
# (see the caddy service below; DOMAIN is required, `up` refuses to start
# without it). The app itself still listens on 127.0.0.1:8123 only and is
# never exposed directly: production cookies are Secure + __Host-, which
# browsers refuse over plain HTTP, so login breaks (see runbook §2C).
# Caddy needs ports 80/443 free and the domain's DNS pointed at the server.
#
# The local postgres/pgadmin services from docker-compose.yml are NOT started here —
# Neon is the database.

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot_migrate
    # One-shot: exits after `alembic upgrade head`. Re-running it is a
    # no-op once the DB is at head. Uses the schema-owner URL when set.
    # C-1: this service deliberately carries ONLY the database env vars —
    # alembic/env.py reads just the DB URL now, so no JWT_SECRET_KEY,
    # DATA_ENCRYPTION_KEY or ALLOWED_* is needed (or wanted) here; the app
    # service below is the only one that holds the app secrets.
    command: ["alembic", "upgrade", "head"]
    # Log rotation (m-15): same 10 MB x 3 bound as the app service —
    # Docker's json-file driver grows without bound by default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ENVIRONMENT: production
      # TZ defence in depth (SM-12/PM-7): app logic uses APP_TIMEZONE,
      # but the container clock also stamps model date defaults — keep
      # it on Yangon time so nothing lands on the previous day.
      TZ: Asia/Yangon
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the Neon connection string}
      # Database TLS (D-m8) — same values as the app service below:
      # migrations connect through the same config, so the migrate job
      # must verify the server's identity too, not just the web process.
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-verify-full}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      # Migrations connect as MIGRATION_DATABASE_URL (bot_migrator) when
      # set; see deploy/db_roles.sql. Leave empty until the roles exist.
      RUN_MIGRATIONS_ON_STARTUP: "false"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot_app
    restart: unless-stopped
    # Resource limits + log rotation (D-m9): Docker's json-file driver
    # grows without bound by default, so a log-spam event could fill the
    # VPS disk. 10 MB x 3 files bounds this container's logs to ~30 MB.
    # The single uvicorn worker stays single — see the Dockerfile CMD
    # comment (no --workers until the in-process export budget moves out
    # of process memory).
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      PORT: 8000
      APP_TIMEZONE: Asia/Yangon
      # TZ defence in depth (SM-12): app logic uses APP_TIMEZONE, but
      # the container clock also stamps model date defaults — keep it
      # on Yangon time so nothing lands on the previous day.
      TZ: Asia/Yangon
      APP_NAME: Business Operations & CEO Tracking System
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the Neon connection string}
      # Database TLS (D-m8): verify the Neon server's identity, don't just
      # encrypt the channel. verify-full is Neon's recommended mode, and
      # the app refuses to start in verify-full without the CA certificate
      # (src/config.py raises) — that fail-loud is the go-live gate, not a
      # bug. Neon uses the public ISRG Root X1 (Let's Encrypt) certificate:
      # fetch its PEM from Neon's "Connect to Neon securely" docs and paste
      # it into the .env file as a quoted multi-line value. Until the CA
      # cert is in place, DATABASE_SSLMODE may stay at `require` — encrypted
      # but unverified — as an explicitly weaker interim step; do NOT put
      # real data in before verify-full works.
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-verify-full}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
      # Least privilege (go-live gate, see deploy/db_roles.sql): after the
      # roles are applied, DATABASE_URL must point at the restricted
      # bot_app role (SELECT/INSERT/UPDATE only, no DDL, no DELETE, audit
      # trail append-only) and MIGRATION_DATABASE_URL at bot_migrator.
      # Until then this stays empty and DATABASE_URL is the owner URL.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set}
      BOOTSTRAP_CHAIRMAN_PASSWORD: ${BOOTSTRAP_CHAIRMAN_PASSWORD:-}
      # JWT_ALGORITHM is pinned to HS256 in code (src/config.py) — not
      # configurable via env, so no variable is passed here.
      JWT_EXPIRE_MINUTES: "480"
      TOTAL_BUSINESS_UNITS: "23"
      # Migrations run in the one-shot `migrate` service above, never in
      # the web container: with the least-privilege roles the runtime role
      # (bot_app) cannot run DDL, so startup migrations would fail with
      # permission denied. Keep this "false".
      RUN_MIGRATIONS_ON_STARTUP: "false"
      # Public host / origin. Derived from DOMAIN (required — TLS is the
      # default path, see the file header). ALLOWED_HOSTS always includes
      # localhost / 127.0.0.1 because the container HEALTHCHECK hits
      # 127.0.0.1 and /healthz is exempt from the check anyway. When DOMAIN
      # is set, ALLOWED_ORIGINS becomes https://<DOMAIN> — the origin the
      # browser sends for state-changing requests.
      # Host/CSRF (P3-8): Caddy forwards the Host header it received — it
      # does not rewrite it. The allowlist below is therefore the
      # enforcement point for the edge middleware's Host check
      # (src/edge.py): a Host that is not the public domain (or
      # localhost/127.0.0.1 for the local health check) is rejected with
      # 400 before the Origin check runs. Never set ALLOWED_HOSTS to "*",
      # and never rely on the proxy to rewrite Host unless the Caddyfile
      # is changed to do so explicitly.
      ALLOWED_HOSTS: ${DOMAIN:+${DOMAIN},}localhost,127.0.0.1
      ALLOWED_ORIGINS: ${DOMAIN:+https://${DOMAIN}}
      # Client IP: Caddy is exactly ONE hop in front of the app and sets
      # X-Forwarded-For (a list — never name it in CLIENT_IP_HEADER,
      # src/client_ip.py rejects list-valued headers). Leave
      # CLIENT_IP_HEADER unset and count one hop in from the right.
      TRUSTED_PROXY_HOPS: "1"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-business-ops-tracker}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    volumes:
      - bot_uploads_data:/app/uploads
    ports:
      - "127.0.0.1:8123:8000"

  caddy:
    # Reverse proxy with automatic HTTPS (R-2). Started by default with
    # every `up` (SM-2) — there is no HTTP-only production path. DOMAIN is
    # required and the Caddyfile fails to load without it.
    image: caddy:2-alpine
    container_name: bot_caddy
    restart: unless-stopped
    # Log rotation (m-15): same 10 MB x 3 bound as the app service —
    # Docker's json-file driver grows without bound by default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set (e.g. export DOMAIN=erp.example.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  bot_uploads_data:
  caddy_data:
  caddy_config:
