name: tests

# Test gate on deploys (A-m2, BOT security review 2026-11-09): the full
# pytest suite (+ the frontend production build) runs on every push/PR,
# so a bad change cannot reach main — and, via deploy_on_push, DigitalOcean
# — untested. The DO PRE_DEPLOY migration job only catches schema errors;
# this is the gate that catches everything else.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # CI-1 (2026-11-17 review): requirements.txt carries no pytest
      # (dev-only dependency), so install it explicitly — without this
      # step `python -m pytest` fails with "No module named pytest" and
      # the gate has never executed a single test. Pinned to 9.1.1, the
      # version the local suite passes against.
      - name: Install pytest
        run: pip install pytest==9.1.1

      # Diagnostic step (CI red on e612511, 2026-11-17): the tests run
      # failed in ~3s with exit 2 and the postgres-check run in ~0s with
      # exit 1, and the logs are not readable without repo-admin rights.
      # This step makes the next failure diagnosable: it proves pytest is
      # actually importable by the same `python` that runs the suite, and
      # shows whether the job-level env (ENVIRONMENT / DATABASE_URL)
      # reached the step — without printing any secret value.
      - name: Verify pytest and env
        run: |
          which python pip
          pip show pytest
          python -c "import os, pytest; print('pytest', pytest.__version__); print('ENVIRONMENT', os.environ.get('ENVIRONMENT')); print('DATABASE_URL set', bool(os.environ.get('DATABASE_URL')))"

      # The SPA smoke test (test_spa_route_returns_index_html) serves
      # frontend/dist/index.html, so the production build must run BEFORE
      # pytest — on a fresh checkout dist/ does not exist yet, and pytest
      # first would make the gate red for a step-ordering reason, not a
      # code reason. (Found while verifying the 2026-11-16 review fix pass:
      # the suite went red locally as soon as dist/ was removed.)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build

      # m-04: lint gate — pyflakes catches undefined names (the C-2
      # Decimal crash shipped with a green suite because no linter ran)
      # and unused imports. Runs before the suite so a lint failure is
      # reported as its own step, not buried in test output.
      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: Pyflakes lint (src + tests)
        run: python -m pyflakes src/ tests/

      - name: Pytest suite
        run: python -m pytest tests/ -q
