name: tests

# Test gate on deploys (A-m2, BOT security review 2026-11-09): the full
# pytest suite (+ the frontend production build) runs on every push/PR,
# so a bad change cannot reach main — and, via deploy_on_push, DigitalOcean
# — untested. The DO PRE_DEPLOY migration job only catches schema errors;
# this is the gate that catches everything else.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # CI-1 (2026-11-17 review): requirements.txt carries no pytest
      # (dev-only dependency), so install it explicitly — without this
      # step `python -m pytest` fails with "No module named pytest" and
      # the gate has never executed a single test. Pinned to 9.1.1, the
      # version the local suite passes against.
      - name: Install pytest
        run: pip install pytest==9.1.1

      # Diagnostic step (CI red on e612511, 2026-11-17): the tests run
      # failed in ~3s with exit 2 and the postgres-check run in ~0s with
      # exit 1, and the logs are not readable without repo-admin rights.
      # This step makes the next failure diagnosable: it proves pytest is
      # actually importable by the same `python` that runs the suite, and
      # shows whether the job-level env (ENVIRONMENT / DATABASE_URL)
      # reached the step — without printing any secret value.
      - name: Verify pytest and env
        run: |
          which python pip
          pip show pytest
          python -c "import os, pytest; print('pytest', pytest.__version__); print('ENVIRONMENT', os.environ.get('ENVIRONMENT')); print('DATABASE_URL set', bool(os.environ.get('DATABASE_URL')))"

      # The SPA smoke test (test_spa_route_returns_index_html) serves
      # frontend/dist/index.html, so the production build must run BEFORE
      # pytest — on a fresh checkout dist/ does not exist yet, and pytest
      # first would make the gate red for a step-ordering reason, not a
      # code reason. (Found while verifying the 2026-11-16 review fix pass:
      # the suite went red locally as soon as dist/ was removed.)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build

      # m-04: lint gate — pyflakes catches undefined names (the C-2
      # Decimal crash shipped with a green suite because no linter ran)
      # and unused imports. Runs before the suite so a lint failure is
      # reported as its own step, not buried in test output.
      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: Pyflakes lint (src + tests)
        run: python -m pyflakes src/ tests/

      # T-m5: run the suite in parallel across workers (pytest-xdist,
      # in requirements-dev.txt). Each worker is its own process, so
      # the process-global state tests poke at (rate limiters,
      # dependency overrides) stays per-worker.
      - name: Pytest suite
        run: python -m pytest tests/ -q -n auto

  # T-M1 (senior review 2026-11-18): the Playwright smoke suite is the
  # only frontend test layer, and it was dead since the ERP removal and
  # never ran anywhere — so its rot was invisible. This job runs it
  # against the dev servers on every push/PR, exactly as
  # frontend/e2e/README.md documents locally.
  e2e:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      ALLOW_DEV_SEED: "true"
      ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: sqlite:////tmp/bot-e2e.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Start the backend in the background against a scratch DB, then
      # read the random dev-seed passwords it writes to
      # .dev_seed_passwords on first boot (M-02) into the E2E_* vars the
      # specs log in with. The DB is a runner-local /tmp file and the
      # passwords are dev-seed throwaways for it — the values are never
      # printed to the log.
      - name: Start backend on a scratch DB
        run: |
          rm -f /tmp/bot-e2e.db .dev_seed_passwords
          nohup python -m uvicorn src.main:app --host 127.0.0.1 --port 8123 > /tmp/e2e-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8123/healthz > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8123/healthz
          test -f .dev_seed_passwords
          {
            echo "E2E_CHAIRMAN_PASSWORD=$(grep '^chairman: ' .dev_seed_passwords | cut -d' ' -f2)"
            echo "E2E_HO_PASSWORD=$(grep '^ho_staff: ' .dev_seed_passwords | cut -d' ' -f2)"
            echo "E2E_CEO_PASSWORD=$(grep '^ceo_bu1: ' .dev_seed_passwords | cut -d' ' -f2)"
          } >> "$GITHUB_ENV"

      # Playwright's webServer starts the vite dev server itself (and
      # reuses it if already running); the backend must already be up
      # on :8123, which the step above guarantees.
      - name: Playwright smoke suite
        working-directory: frontend
        run: npm run test:e2e
