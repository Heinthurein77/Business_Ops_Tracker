name: postgres-check

# T-m4 (BOT security review 2026-11-09): Postgres-only behaviour is
# statically asserted by the SQLite suite but never executed. This
# workflow runs the migration chain against a real postgres:16-alpine
# service and executes tests/test_bot_review_minors_postgres.py, which
# attempts one violating insert per CHECK / partial unique index / FK
# ON DELETE policy and asserts the database itself rejects it.
# CM-3 (BOT real-time risk review 2026-11-09): it also ran
# tests/test_rt_postgres_concurrency.py, which raced two threads
# against receive_po / send_invoice / record_payment and asserted
# exactly one success + a 409 loser on Postgres. That file was deleted
# with the ERP removal (2026-11-17) — the concurrency proof it ran
# tested ERP endpoints that no longer exist. Its tracker successor is
# tests/test_review_d_postgres_concurrency.py (M-14, 2026-11-17), which
# races two threads against POST /api/ceo/submit-report and asserts
# exactly one success + a 409 loser on Postgres.
# Runs on every push/PR to main and weekly (a typo in a CHECK expression
# that is syntactically valid would otherwise surface only on Neon).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot_pgcheck
          POSTGRES_PASSWORD: bot_pgcheck
          POSTGRES_DB: bot_pgcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://bot_pgcheck:bot_pgcheck@localhost:5432/bot_pgcheck
      MIGRATION_DATABASE_URL: postgresql+psycopg2://bot_pgcheck:bot_pgcheck@localhost:5432/bot_pgcheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # CI-1 (2026-11-17 review): see tests.yml — requirements.txt
      # carries no pytest, so install it explicitly (9.1.1, the version
      # the local suite passes against) or the proof-test step below
      # fails with "No module named pytest".
      - name: Install pytest
        run: pip install pytest==9.1.1

      # Diagnostic step (CI red on e612511, 2026-11-17): see tests.yml —
      # same step here. The postgres-check run failed in ~0s with exit 1,
      # so this proves pytest is importable by the same `python` that runs
      # the step and shows whether the job-level env reached it, without
      # printing any secret value (DATABASE_URL here holds a password).
      - name: Verify pytest and env
        run: |
          which python pip
          pip show pytest
          python -c "import os, pytest; print('pytest', pytest.__version__); print('ENVIRONMENT', os.environ.get('ENVIRONMENT')); print('DATABASE_URL set', bool(os.environ.get('DATABASE_URL')))"

      - name: Run migration chain on Postgres
        run: python -m alembic upgrade head

      - name: Postgres-only constraint checks
        run: python -m pytest tests/test_bot_review_minors_postgres.py tests/test_review_d_postgres_concurrency.py -q
